name: CI - DevOps Platform Lab

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'app/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/ci.yaml'

permissions:
  contents: read
  packages: write

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar tests
        run: python -m pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Autenticarse en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagen Docker
        run: |
          docker build -t ghcr.io/eduardoescagedo/devops-platform-lab:${{ github.sha }} .

      - name: Publicar imagen en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/eduardoescagedo/devops-platform-lab:${{ github.sha }}

  deploy-staging:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Actualizar imagen de staging
        working-directory: k8s/overlays/staging
        run: |
          kustomize edit set image ghcr.io/eduardoescagedo/devops-platform-lab=ghcr.io/eduardoescagedo/devops-platform-lab:${{ github.sha }}

      - name: Guardar cambios en Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/overlays/staging/kustomization.yaml

          if ! git diff --cached --quiet; then
            git commit -m "ci: deploy image ${{ github.sha }} to staging"
            git push origin HEAD:main
          fi
