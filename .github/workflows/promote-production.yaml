name: CD - Promote to Production

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote-production:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Instalar Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Obtener imagen de staging
        id: staging
        run: |
          TAG=$(grep 'newTag:' k8s/overlays/staging/kustomization.yaml | awk '{print $2}')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Imagen que vamos a promocionar: $TAG"

      - name: Actualizar imagen de producción
        working-directory: k8s/overlays/production
        run: |
          kustomize edit set image \
            ghcr.io/eduardoescagedo/devops-platform-lab=ghcr.io/eduardoescagedo/devops-platform-lab:${{ steps.staging.outputs.tag }}

      - name: Guardar cambios en Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/overlays/production/kustomization.yaml

          if ! git diff --cached --quiet; then
            git commit -m "cd: promote ${{ steps.staging.outputs.tag }} to production"
            git push origin HEAD:main
          fi
