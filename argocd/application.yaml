apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-platform-lab
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/EduardoEscagedo/devops-platform-lab.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-lab

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
