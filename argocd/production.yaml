apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-staging
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/EduardoEscagedo/devops-platform-lab.git
    targetRevision: main
    path: k8s/overlays/production

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-lab-production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

